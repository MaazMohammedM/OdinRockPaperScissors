<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="./index.js" defer></script>
    <link rel="stylesheet" href="./style.css">

</head>
<body>
    <div class="container">
        <h1>Rock Paper Scissors</h1>
        <div class="scoreBox">
            <h3>Score Board</h3>
            <div>Computer:<span id="compScore"></span></div>
            <div>You:<span id="yourScore"></span></div>
        </div>
        <div id="selectionBox">
            <p>Computer Selected : <span id="ComputerSelection"></span></p>
            <p><span id="yourSelection"></span> : You Selected</p>
        </div>
        <p id="result"></p>
        <div id="userSelection">
             <button id="rockBtn" class="btn">Rock</button>
        <button id="paperBtn" class="btn">Paper</button>
        <button id="scissorBtn" class="btn">Scissors</button>
        </div>
       
    </div>
</body>
</html>
